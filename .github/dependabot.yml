version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    versioning-strategy: "increase"
    commit-message:
      prefix: "[Dependency Update]"
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[CI Update]"
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    directories:
      - "/infra/modules/access"
      - "/infra/modules/environment"
      - "/infra/modules/kv"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[Infrastructure Update]"
    groups:
      dependencies:
        patterns:
          - "*"
