name: Pull Request

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.8.14

      - name: Install application dependencies
        run: make install

      - name: Check application
        run: |
          make architecture
          make format-check
          make lint
          make typecheck
          make test
          make worker-infra-test

  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.8.14

      - name: Check infrastructure
        run: make infra-check

      - name: Summarize infrastructure validation
        if: always()
        shell: bash
        run: |
          printf '%s\n' \
            '## Infrastructure validation' \
            '' \
            '- Terraform and Terragrunt formatting and validation cover `dev` and `prod`.' \
            '- Terraform tests apply the development composition and plan production with a mocked Cloudflare provider.' \
            '- The application job verifies the generated development binding against the Worker and local KV runtime.' \
            '- Desired inventory: `edgeflags-dev-flags` and `edgeflags-prod-flags` KV namespaces.' \
            '' \
            'A separate protected job produces a remote development plan after R2 state is enabled. Infracost does not price Cloudflare KV resources.' \
             >> "$GITHUB_STEP_SUMMARY"

  remote-plan:
    name: Development plan
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.R2_STATE_ENABLED == 'true'
    needs: infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev-plan
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      ACCESS_ALLOWED_EMAILS: ${{ vars.DEV_ACCESS_ALLOWED_EMAILS }}
      ACCESS_ENABLED: ${{ vars.ACCESS_ENABLED }}
      ACCESS_HOSTNAME: ${{ vars.DEV_ACCESS_HOSTNAME }}
      ACCESS_SERVICE_TOKEN_ID: ${{ vars.DEV_ACCESS_SERVICE_TOKEN_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLAN_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.8.14

      - name: Plan development infrastructure
        run: make infra-plan ENV=dev

      - name: Publish plan summary
        run: make infra-plan-summary ENV=dev >> "$GITHUB_STEP_SUMMARY"

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.8.14

      - name: Scan repository
        run: make security
