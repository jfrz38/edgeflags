name: Development Deployment

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    if: vars.DEV_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.8.14

      - name: Install application dependencies
        run: make install

      - name: Run required checks
        run: make check

  deploy:
    name: Deploy development
    if: vars.DEV_CD_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_STATE_SECRET_ACCESS_KEY }}
      AWS_EC2_METADATA_DISABLED: "true"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.8.14

      - name: Install application dependencies
        run: make install

      - name: Back up development state
        env:
          R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
        run: make infra-state-backup ENV=dev

      - name: Plan development infrastructure
        run: make infra-plan ENV=dev

      - name: Apply reviewed development plan
        run: make infra-apply ENV=dev

      - name: Deploy development Worker
        run: make deploy ENV=dev

      - name: Smoke-test development
        run: make smoke ENV=dev BASE_URL="${{ vars.DEV_BASE_URL }}"

      - name: Summarize deployment
        if: always()
        shell: bash
        run: |
          printf '%s\n' \
            '## Development deployment' \
            '' \
            '- Commit: `${{ github.sha }}`' \
            '- Environment: `dev`' \
            '- Result: `${{ job.status }}`' \
            '' \
            'A failed smoke test marks the deployment as failed. Worker recovery is explicit; Terraform is never rolled back automatically.' \
            >> "$GITHUB_STEP_SUMMARY"
